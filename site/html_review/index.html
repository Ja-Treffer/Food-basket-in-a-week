<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一周菜篮 · 轻考核</title>
<style>
  :root{
    --bg:#f5f3ed; --paper:#fffefb; --ink:#23221e; --soft:#6d675c;
    --line:#d9d4c8; --good:#3f7461; --bad:#b8503f; --blue:#3d6480;
    --amber:#a8762c; --tint:#efece2;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.75; letter-spacing:.01em;
  }
  .wrap{max-width:840px; margin:0 auto; padding:28px 20px 72px}

  h1{font-size:25px; line-height:1.35; margin:0 0 4px; letter-spacing:.04em}
  h1 small{display:block; font-size:13px; font-weight:400; color:var(--soft); letter-spacing:.08em; margin-top:5px}

  .ledger{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0 0}
  .lc{background:var(--paper); border:1px solid var(--line); border-radius:5px; padding:8px 10px}
  .lc .k{font-size:11.5px; color:var(--soft); letter-spacing:.06em; display:flex; justify-content:space-between; gap:4px}
  .lc .v{font-size:13.5px; font-weight:600; margin-top:2px}
  .lc.p{border-left:3px solid var(--good)}
  .lc.s{border-left:3px solid #4d7f8a}
  .lc.c{border-left:3px solid var(--amber)}
  .lc.m{border-left:3px solid var(--blue)}

  .bar{
    position:sticky; top:0; z-index:9; margin:18px 0 0;
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
    background:rgba(245,243,237,.95); backdrop-filter:blur(6px);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:8px 2px; font-size:13.5px; color:var(--soft);
  }
  .bar .sp{flex:1}
  .tt{font-variant-numeric:tabular-nums;font-size:13px;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .tt.warn{color:var(--bad);border-color:#dda9a1}
  .bar b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
  button, select{
    font:inherit; font-size:13.5px; color:#2c2a25; background:var(--paper);
    border:1px solid var(--line); border-radius:5px; padding:6px 13px; cursor:pointer;
    transition:background .12s,border-color .12s;
  }
  select{padding:5px 6px; color:var(--soft)}
  button:hover{background:#f7f5ee; border-color:#c3bcab}
  button:focus-visible, select:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
  button.primary{background:#2c2a25; color:#fffefb; border-color:#2c2a25}
  button.primary:hover{background:#413d34}

  article.q{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:17px 20px 15px; margin:12px 0}
  article.q:first-child{margin-top:14px}
  .qh{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--soft); letter-spacing:.06em}
  .qh .no{font-variant-numeric:tabular-nums; font-weight:600; color:#8d8676}
  .qh .tag{background:var(--tint); border-radius:3px; padding:1px 7px}
  .qh .ref{margin-left:auto; color:#a69e8c}
  h3{font-size:16.5px; line-height:1.7; margin:8px 0 11px; font-weight:600}

  ol.opts{list-style:none; margin:0; padding:0; display:grid; gap:6px}
  ol.opts li{margin:0}
  .opt{
    width:100%; text-align:left; display:flex; gap:11px; align-items:flex-start;
    background:#fcfbf6; border:1px solid #e4dfd1; border-radius:5px;
    padding:9px 13px; font-size:15px; line-height:1.6; color:#2c2a25;
    cursor:pointer; transition:background .12s,border-color .12s;
  }
  .opt b{font-weight:600; color:#8d8676; font-size:13px; line-height:1.9; flex:none; width:15px}
  .opt:hover:not(:disabled){background:#f6f3e9; border-color:#cbc4b1}
  .opt:disabled{cursor:default}
  .opt.right{background:#e6f0ea; border-color:#93bfa8}
  .opt.right b{color:var(--good)}
  .opt.wrong{background:#f9e9e6; border-color:#dda9a1}
  .opt.wrong b{color:var(--bad)}
  .opt.dim{opacity:.55}

  .fb{margin-top:12px; border-top:1px dashed #e0dbcc; padding-top:11px; font-size:14.5px; line-height:1.72}
  .verdict.ok{color:#2f6152}
  .verdict.bad{color:#9c4132}
  .verdict{font-weight:600; margin-bottom:7px}
  .verdict.ok{color:var(--good)}
  .verdict.no{color:var(--bad)}
  .verdict .cor{display:block; font-weight:400; color:#4a4638; margin-top:2px; font-size:14px}
  .fb p{margin:6px 0}
  .fb p>b{font-weight:600; color:#5d5647; margin-right:8px; letter-spacing:.06em; font-size:12.5px}
  .fb p.you b{color:var(--bad)}
  .opt.chosen{background:#eef2f6; border-color:#9fb3c5}
  .rev{margin:10px 0 4px}
  .revrow{display:flex; gap:10px; padding:9px 10px; border:1px solid #e9e4d6; border-radius:6px; background:#fffdf7; margin:6px 0}
  .revrow.chosen{background:#eef2f6; border-color:#9fb3c5}
  .revrow .badge{flex:0 0 auto; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%;
    background:#ece7d8; color:#6b6559; font-size:12px; font-weight:600; margin-top:2px}
  .revrow.chosen .badge{background:#3d6480; color:#fff}
  .revbody{flex:1 1 auto; min-width:0}
  .revtext{font-size:14.5px; line-height:1.5}
  .chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;letter-spacing:.04em}
  .chip.mech{background:#e6f0ea;color:#2f6152;border:1px solid #b6d3c4}
  .chip.slogan{background:#f7ecd9;color:#8a5f1f;border:1px solid #e2c79a}
  .chip.wrong{background:#f9e9e6;color:#9c4132;border:1px solid #e5bcb4}
  .revfx{margin-top:3px; font-size:12.5px; color:#3d6480; letter-spacing:.02em}
  .revnote{margin-top:5px; font-size:13.5px; line-height:1.7; color:#4a443a}
  .fb .src{font-size:12px; color:#a69e8c; letter-spacing:.06em; margin-top:8px}

  footer{margin-top:40px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--soft); line-height:1.75}
  footer b{color:#4a4638; font-weight:600}

  @media (max-width:620px){
    body{font-size:15px}
    .wrap{padding:20px 14px 64px}
    h1{font-size:20px}
    .ledger{grid-template-columns:repeat(2,1fr)}
    article.q{padding:14px 14px 12px}
    h3{font-size:15.5px}
    .opt{font-size:14.5px}
    .bar{flex-wrap:wrap; gap:7px; padding:7px 0}
    .bar .sp{display:none}
    .bar #prog{width:100%}
    .bar button, .bar select{flex:1 1 0; text-align:center; padding:7px 4px}
  }

  @media print{
    @page{margin:14mm 15mm}
    :root{--paper:#fff; --bg:#fff}
    body{background:#fff; font-size:10pt; line-height:1.45}
    .wrap{max-width:none; padding:0}
    .bar{display:none}
    h1{font-size:16pt}
    .ledger{gap:5pt; margin-top:7pt}
    .lc{padding:4pt 7pt}
    article.q{break-inside:avoid; page-break-inside:avoid; border-color:#bbb; margin:6pt 0; padding:6pt 8pt}
    h3{font-size:10.6pt; margin:4pt 0 5pt}
    ol.opts{gap:3pt}
    .opt{border-color:#ccc; background:#fff; padding:3pt 6pt; font-size:9.6pt}
    .opt.right{background:#f1f1f1; border-color:#999; font-weight:600}
    .opt.wrong{background:#fff}
    .fb{display:block!important; border-top-style:solid; margin-top:6pt; padding-top:5pt; font-size:9.2pt; line-height:1.42}
    .fb p{margin:3pt 0}
    .verdict{margin-bottom:3pt}
    footer{margin-top:10pt; font-size:8.4pt}
    a{text-decoration:none; color:inherit}
  }
</style>
</head>

      ]
    },
    {

      ],
      "why": [
        "账要算「全程」：从产地到货架都要维持低温，制冷要电；链上任何一段断开或超时，损耗也会更高。这两笔加起来，才让它比常温食品重。",
        "帳要算「全程」：從產地到貨架都要維持低溫，製冷要電；鏈上任何一段斷開或超時，損耗也會更高。這兩筆加起來，才讓它比常溫食品重。",
        "Count the whole chain: cold has to be maintained from farm to shelf, and refrigeration draws power; any break or delay in the chain also raises losses. Those two together are the weight."
      ],
      "x": [

        ],
        [
          "包装是一个因素，但决定量级的是制冷，不是印刷。",

        [

        ],
        [

        ]
      ],
      "tag": [
        "slogan",

  var TT = { left: 180, timer: null };
  function ttPaint(){
    var el = document.getElementById('tt');
    if (!el) return;
    var v = Math.max(0, TT.left);
    el.textContent = Math.floor(v / 60) + ':' + ('0' + (v % 60)).slice(-2);
    el.className = 'tt' + (v <= 45 ? ' warn' : '');
    if (v === 0) el.title = '预算用完了；这一页只是练习，可以继续做';
  }
  function ttStart(){
    if (TT.timer) return;
    ttPaint();
    TT.timer = setInterval(function(){
      if (TT.left > 0) { TT.left--; ttPaint(); }
      else { clearInterval(TT.timer); TT.timer = null; }
    }, 1000);
  }
  function ttStop(){ if (TT.timer) { clearInterval(TT.timer); TT.timer = null; } }

  var LB = "ABCD";
  var LIDX = 0;
  var cur = [];
  var picked = [];

  var sheet   = document.getElementById("sheet");
  var prog    = document.getElementById("prog");
  var revealB = document.getElementById("revealBtn");
  var drawB   = document.getElementById("drawBtn");
  var printB  = document.getElementById("printBtn");
  var langSel = document.getElementById("lang");

  function T(v){ return v ? (v[LIDX] || v[0]) : ""; }

  /* ---------- 语言 ---------- */
  function applyLang(){
    document.documentElement.lang = ["zh-Hans","zh-Hant","en"][LIDX];
    document.title = T(UI.docTitle);
    document.getElementById("ttl").firstChild.nodeValue = T(UI.h1);
    document.getElementById("sub").textContent = T(UI.sub);
    var kv = {lp:UI.lp, ls:UI.ls, lc:UI.lc, lm:UI.lm, lpv:UI.low, lsv:UI.high, lcv:UI.high, lmv:UI.high};
    var nodes = document.querySelectorAll("[data-k]");
    for (var i = 0; i < nodes.length; i++){
      nodes[i].textContent = T(kv[nodes[i].getAttribute("data-k")]);
    }
    revealB.textContent = T(UI.reveal);
    drawB.textContent   = T(UI.draw);
    printB.textContent  = T(UI.print);
    langSel.value = String(LIDX);
    document.getElementById("ft1").innerHTML = "<b>" + (LIDX === 2 ? "Sources: " : T(UI.src)) + "</b>" + T(UI.ft1);
    document.getElementById("ft2").textContent = T(UI.ft2);
  }

  function saveLang(){
    try { localStorage.setItem("cailan.review.lang", String(LIDX)); } catch(e){}
  }
  function loadLang(){
    var m = /[?&]lang=([^&]+)/.exec(location.search);
    if (m){
      var v = decodeURIComponent(m[1]).toLowerCase();
      if (v === "0" || v === "zh" || v === "zh-hans" || v === "cn") return 0;
      if (v === "1" || v === "tw" || v === "zh-tw" || v === "zh-hant") return 1;
      if (v === "2" || v === "en" || v === "en-us" || v === "en-gb") return 2;
    }
    try {
      var s = localStorage.getItem("cailan.review.lang");
      if (s !== null && +s >= 0 && +s <= 2) return +s;
    } catch(e){}
    // 默认英文；要中文就点下拉或加 ?lang=zh / ?lang=tw。
    return 2;
  }

  /* ---------- 抽样 ---------- */
  function makeRnd(){
    var m = /[?&]seed=([^&]+)/.exec(location.search);
    if (!m) return Math.random;
    var str = decodeURIComponent(m[1]), s = 2166136261;
    for (var i = 0; i < str.length; i++){
      s ^= str.charCodeAt(i);
      s = Math.imul(s, 16777619) >>> 0;
    }
    return function(){
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var RND = makeRnd();

  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(RND() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function drawSet(){
    var idx = [];
    for (var i = 0; i < Q.length; i++) idx.push(i);
    shuffle(idx);
    return idx.slice(0, TAKE);
  }

  /* ---------- 渲染 ---------- */
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function build(){
    var html = "";
    for (var p = 0; p < cur.length; p++){
      var q = Q[cur[p]];
      html += '<article class="q" id="q' + p + '">' +
        '<div class="qh"><span class="no">0' + (p + 1) + '</span>' +
        '<span class="tag">' + esc(T(UI[G[q.g]])) + '</span>' +
        '<span class="ref">' + esc(T(UI.refTag)) + ' ' + esc(q.ref) + '</span></div>' +
        '<h3>' + esc(T(q.t)) + '</h3><ol class="opts">';

      for (var k = 0; k < q.o.length; k++){
        html += '<li><button type="button" class="opt" data-p="' + p + '" data-k="' + k + '">' +
                '<b>' + LB[k] + '</b><span>' + esc(T(q.o[k])) + '</span></button></li>';
      }
      html += '</ol><div class="fb" hidden></div></article>';
    }
    sheet.innerHTML = html;
  }

  var AX = {
    p:["环境负荷","環境負荷","Environmental load"],
    s:["营养均衡","營養均衡","Nutrition"],
    c:["口味接受度","口味接受度","Acceptance"],
    m:["可用钱","可用錢","Money left"]
  };

  function num(n){
    n = Math.round(n);
    return n > 0 ? "+" + n : (n < 0 ? "−" + Math.abs(n) : "0");
  }

  // 0 表示「这条轴基本不动」，不显示 —— 免得四项都挂一串 0。
  function fxLine(fx){
    if (!fx) return "";
    var out = [];
    ["p", "s", "c", "m"].forEach(function(k){
      var r = fx[k] || [0, 0];
      if (!r[0] && !r[1]) return;
      var a = Math.min(r[0], r[1]), b = Math.max(r[0], r[1]);
      out.push(T(AX[k]) + " " + (a === b ? num(a) : num(a) + "…" + num(b)));
    });
    return out.length ? out.join(" · ") + "　" + T(UI.unit) : T(UI.noFx);
  }

  function paint(p){
    var q = Q[cur[p]];
    var art = document.getElementById("q" + p);
    if (!art) return;
    var btns = art.querySelectorAll(".opt");
    var pick = picked[p];

    for (var j = 0; j < btns.length; j++){
      var k = +btns[j].getAttribute("data-k");
      btns[j].disabled = true;
      if (k === pick) btns[j].classList.add("chosen");
      btns[j].classList.remove("dim");
    }

    var fb = art.querySelector(".fb");
    var head = pick < 0 ? T(UI.revNone) : (pick === q.a ? T(UI.okMsg) : T(UI.badMsg).replace("%s", LB[q.a]));
    var cls0 = pick < 0 ? '' : (pick === q.a ? ' ok' : ' bad');
    var s2 = '<div class="verdict' + cls0 + '">' + esc(head) + '</div><div class="rev">';

    for (var r = 0; r < q.o.length; r++){
      var note = (r === q.a) ? q.why : (q.x[r] || q.why);
      var cls = (r === pick) ? "revrow chosen" : "revrow";
      var cell;
      if (q.kind === "derive"){
        var tg = (q.tag && q.tag[r]) || "mech";
        var lab = tg === "mech" ? T(UI.tMech) : (tg === "slogan" ? T(UI.tSlogan) : T(UI.tWrong));
        cell = '<span class="chip ' + tg + '">' + esc(lab) + '</span>';
      } else {
        cell = '<span class="fxtext">' + esc(fxLine(q.fx && q.fx[r])) + '</span>';
      }
      s2 += '<div class="' + cls + '">' +
            '<span class="badge">' + LB[r] + '</span>' +
            '<div class="revbody">' +
              '<div class="revtext">' + esc(T(q.o[r])) + '</div>' +
              '<div class="revfx">' + cell + '</div>' +
              '<div class="revnote">' + esc(T(note)) + '</div>' +
            '</div></div>';
    }

    s2 += '</div><p class="src">' + esc(T(UI.src)) + esc(q.ref) + '</p>';

    fb.innerHTML = s2;
    fb.hidden = false;
  }

  function update(){
    var n = 0;
    for (var i = 0; i < picked.length; i++) if (picked[i] >= 0) n++;
    var c = 0;
    for (var j = 0; j < picked.length; j++) if (picked[j] >= 0 && picked[j] === Q[cur[j]].a) c++;
    prog.innerHTML = T(UI.prog) + " <b>" + n + "</b> / " + cur.length +
      (n ? "　·　" + T(UI.score) + " <b>" + c + "</b> / " + n : "");
    if (n >= cur.length && cur.length) ttStop(); else ttStart();
  }

  function newSet(){
    cur = drawSet();
    picked = cur.map(function(){ return -1; });
    TT.left = 180; ttStop();
    build();
    update();
  }

  sheet.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".opt") : null;
    if (!b || b.disabled) return;
    var p = +b.getAttribute("data-p");
    var k = +b.getAttribute("data-k");
    if (picked[p] >= 0) return;
    picked[p] = k;
    paint(p);
    update();
  });

  revealB.addEventListener("click", function(){
    for (var p = 0; p < cur.length; p++) paint(p);
    update();
  });

  drawB.addEventListener("click", function(){
    newSet();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  langSel.addEventListener("change", function(){
    LIDX = +langSel.value || 0;
    saveLang();
    applyLang();
    newSet();          // 语言变了，题面要重建
  });

  function pourPrint(){
    for (var p = 0; p < cur.length; p++) paint(p);
    update();
  }

  printB.addEventListener("click", function(){
    pourPrint();
    window.print();
  });

  window.onbeforeprint = pourPrint;

  LIDX = loadLang();
  applyLang();
  newSet();
})();
</script>
